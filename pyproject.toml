[project]
name = "mini-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SiGMan", email = "sigman@ioupg.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ddgs>=8.1.1",
    "httpx>=0.28.1",
    "langgraph>=1.1.2",
    "litellm>=1.82.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.13.1",
    "rich>=14.3.3",
    "trafilatura>=2.0.0",
    "typer>=0.24.1",
]

[project.optional-dependencies]
extras = [
    "crawl4ai>=0.8.0",
    "praw>=7.8.1",
]

[project.scripts]
mini-research = "mini_research.cli:app"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: live network tests, excluded from default run"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "respx>=0.22.0",
    "ruff>=0.15.6",
    "truststore>=0.10.4",
    "vcrpy>=8.1.1",
]
